<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Интерактивные макеты недостающих состояний Anavasi, этап 4.">
  <title>Anavasi · Этап 4</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a href="../index.html" class="wordmark">ANAVASI <span>Дизайн-ревью</span></a>
    <nav aria-label="Этапы"><a href="../stage-3/index.html">Этап 3</a><span aria-current="page">Этап 4 · R1</span></nav>
  </header>
  <main class="workbench">
    <aside class="index">
      <p class="eyebrow">МАКЕТЫ НА СОГЛАСОВАНИЕ</p>
      <h1>Этап 4</h1>
      <p>Выберите сценарий, затем попробуйте его в окне приложения.</p>
      <nav id="index" aria-label="Сценарии"></nav>
    </aside>
    <section class="review" aria-label="Предпросмотр">
      <div class="controls">
        <label>Язык <select id="language"><option value="ru">Русский</option><option value="en">English</option></select></label>
        <label>Экран <select id="width"><option value="390">390 px</option><option value="320">320 px</option></select></label>
        <label>Системный шрифт <select id="zoom"><option value="1">100%</option><option value="1.3">130%</option><option value="2">200%</option></select></label>
        <button id="reset" type="button">Сбросить</button>
      </div>
      <div class="device" id="device" lang="ru">
        <div class="statusbar" aria-hidden="true"><span>09:41</span><span>▮▮▮ ▰</span></div>
        <div class="surface" id="surface"></div>
        <div class="systembar" aria-hidden="true"><span></span></div>
      </div>
    </section>
    <aside class="notes">
      <p class="eyebrow" id="state-code"></p>
      <h2 id="state-title"></h2>
      <p id="state-note"></p>
      <a id="reference" href="https://www.figma.com/design/gO7czKDJEPs8z3aG2YPlAE?node-id=0-75">Смежный экран в Figma ↗</a>
      <p class="scope">Демо использует вымышленные данные. Настройки предпросмотра и тестовые действия сбрасываются при перезагрузке.</p>
    </aside>
  </main>
</body>
</html>
